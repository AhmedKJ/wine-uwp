name: Build Wine-UWP

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/main.yml"
      - "build.sh"
      - "conf.sh"
      - "configure"
      - "configure.ac"
      - "**/*.c"
      - "**/*.h"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential gcc-multilib g++-multilib \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 \
            gcc-mingw-w64-i686 g++-mingw-w64-i686 \
            clang lld llvm ccache \
            git make autoconf automake libtool \
            flex bison perl gettext pkg-config \
            python3 python3-mako python3-pip \
            meson ninja-build \
            libasound2-dev libdbus-1-dev \
            libfontconfig-dev libfreetype-dev \
            libgl1-mesa-dev libgnutls28-dev \
            libjpeg-dev libpng-dev \
            libncurses-dev libopenal-dev \
            libpulse-dev libsdl2-dev \
            libudev-dev libunwind-dev \
            libusb-1.0-0-dev libvulkan-dev \
            libwayland-dev libx11-dev \
            libxcomposite-dev libxcursor-dev \
            libxext-dev libxi-dev \
            libxinerama-dev libxrandr-dev \
            libxrender-dev libxfixes-dev \
            libxkbcommon-dev libxxf86vm-dev \
            zlib1g-dev

      - name: Configure Wine-UWP
        run: |
          chmod +x conf.sh build.sh
          ./conf.sh

      - name: Build Wine-UWP
        run: |
          sed -i 's/make -j24/make -j2/g' build.sh
          ./build.sh
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache

      - name: Prepare compiled binary archive
        if: success()
        run: |
          mkdir -p artifacts
          tar -czf artifacts/wine-uwp-linux.tar.gz \
            -C build \
            64 \
            32
          ls -lh artifacts

      - name: Upload compiled binary as workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wine-uwp-linux-binaries
          path: artifacts/wine-uwp-linux.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Package logs
        if: always()
        run: |
          mkdir -p output
          tar -czf output/build-logs.tar.gz \
            build/64/config.log build/32/config.log \
            2>/dev/null || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wine-uwp-build-logs
          path: output/
          if-no-files-found: warn
          retention-days: 7
